[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "mind3r-backend"
version = "1.0.0"
description = "Reminders (Backend)"
license = "GPL-3.0-only"
authors = [{ name = "Chris Post", email = "admin@postfmly.com" }]
keywords = ["reminder"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment :: Mozilla",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Typing :: Typed",
]
dependencies = [
    "cachetools>=7.1.4",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136.3",
    "nh3>=0.3.5",
    "peewee>=4.0.6",
    "pluralizer>=2.0.0",
    "pydantic>=2.13.4",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "semver>=3.0.4",
    "str2bool3>=1.3.0",
]
requires-python = ">=3.14"

[project.urls]
GitHub = "https://github.com/chump29/mind3r"

[project.optional-dependencies]
dev = [
    "behave>=1.3.3",
    "coverage>=7.14.1",
    "pre-commit>=4.6.0",
    "pylint>=4.0.5",
    "types-behave>=1.3.0.20260408",
    "types-peewee>=4.0.5.20260518",
]

[tool.coverage.run]
omit = ["features/environment.py"]

[tool.coverage.report]
exclude_also = [
    "__name__",
    "DEBUG",
    "except",
    "get_day",
    "if not m:",
    "invalid_*",
    "log",
    "Path",
]
fail_under = 100
precision = 2
show_missing = true

[tool.pylint.master]
ignore-paths = [".venv"]

[tool.pylint."messages control"]
disable = ["C0411"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
ignore = ["D203", "D212", "D400", "D415", "S101"]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FAST",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TD",
    "TID",
    "TRY",
    "UP",
    "W",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.uv]
python-downloads = "manual"
required-version = ">=0.11"

[tool.uv.build-backend]
namespace = true
source-exclude = [
    ".coverage",
    ".dockerignore",
    ".pre-commit-config.yaml",
    ".python-version",
    ".ruff_cache/**/*",
    ".venv/**/*",
    "*.sh",
    "api.rest",
    "db/*",
    "Dockerfile",
    "features/**/*",
    "README.md",
    "uv.lock",
]
